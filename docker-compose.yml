version: '3.8'

services:
  playground:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - seccomp=unconfined
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M 